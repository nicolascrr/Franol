# GitLeaks configuration — prevents secrets from being committed to the repository.
# Run: `gitleaks detect --source .` to scan manually.
# In CI: `gitleaks detect --source . --no-git` for uncommitted changes.

title = "Frañol Secret Detection Rules"

[allowlist]
  description = "Global allow list — paths and patterns that are safe to ignore"
  paths = [
    '''\.env\.example$''',
    '''\.gitleaks\.toml$''',
    '''package-lock\.json$''',
    '''pnpm-lock\.yaml$''',
  ]

[[rules]]
  id = "franol-app-password"
  description = "APP_PASSWORD environment variable with actual value"
  regex = '''APP_PASSWORD\s*=\s*[^\s$#{}]+'''
  tags = ["key", "password"]
  [[rules.allowlist]]
    regexes = [
      '''APP_PASSWORD\s*=\s*your_secure_password_here''',
      '''APP_PASSWORD\s*=\s*changeme''',
      '''APP_PASSWORD\s*=\s*<.*>''',
    ]

[[rules]]
  id = "gemini-api-key"
  description = "Google Gemini API Key"
  regex = '''GEMINI_API_KEY\s*=\s*AIza[0-9A-Za-z_-]{35}'''
  tags = ["key", "api"]

[[rules]]
  id = "supabase-anon-key"
  description = "Supabase Anonymous Key (JWT)"
  regex = '''NEXT_PUBLIC_SUPABASE_ANON_KEY\s*=\s*eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''
  tags = ["key", "jwt"]
  [[rules.allowlist]]
    regexes = [
      '''NEXT_PUBLIC_SUPABASE_ANON_KEY\s*=\s*your_supabase_anon_key_here''',
    ]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key pattern"
  regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?token|auth[_-]?token)\s*[=:]\s*['"]?[0-9a-zA-Z_-]{20,}['"]?'''
  tags = ["key", "generic"]
  [[rules.allowlist]]
    paths = [
      '''\.env\.example$''',
    ]

[[rules]]
  id = "private-key"
  description = "Private key block"
  regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
  tags = ["key", "private"]

[[rules]]
  id = "base64-encoded-secret"
  description = "Base64-encoded secret (high entropy)"
  regex = '''(?i)(secret|password|token|key|credential)\s*[=:]\s*['"]?[A-Za-z0-9+/]{40,}={0,2}['"]?'''
  tags = ["secret", "base64"]
  [[rules.allowlist]]
    paths = [
      '''\.env\.example$''',
      '''\.gitleaks\.toml$''',
    ]
