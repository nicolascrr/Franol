# ──────────────────────────────────────────────────────────────────────────────
# Frañol — Security & Quality CI Pipeline
#
# Runs on every push and pull request to main/master.
# Blocks deployment if any step fails.
# ──────────────────────────────────────────────────────────────────────────────

name: Security & Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Prevent parallel runs on the same branch
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions — principle of least privilege
permissions:
  contents: read
  security-events: write

jobs:
  # ── Job 1: Dependency Installation + Caching ──
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ── Job 2: TypeScript Type Check ──
  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 3: ESLint (Security Rules) ──
  lint:
    name: Lint & Security Rules
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ── Job 4: Secret Scanning (GitLeaks) ──
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate scanning

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Job 5: Dependency Vulnerability Scan ──
  dependency-scan:
    name: Dependency Audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (high/critical)
        run: pnpm audit --audit-level=high
        continue-on-error: false

  # ── Job 6: Build Verification ──
  build:
    name: Build Check
    needs: [typecheck, lint, secret-scan, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Dummy env vars for build — not real secrets
          APP_PASSWORD: ci-dummy-password
          GEMINI_API_KEY: ci-dummy-key
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key

  # ── Job 7: Production Safety Gate ──
  # Only runs on main/master push (not PRs).
  # Requires all previous jobs to pass.
  deploy-gate:
    name: 🛡️ Production Safety Gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approve Deployment
        run: |
          echo "✅ All security checks passed"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "🚀 Deployment is approved and ready to proceed."
